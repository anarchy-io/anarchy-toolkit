name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-api/**'
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'src/Automation.Build/**'
      - 'src/*/README.md'
      - 'samples/README.md'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  build:
    name: "[Push] Build site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync package and sample READMEs
        run: docs/scripts/sync-readmes.sh

      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build API reference with DocFX
        run: ./src/Automation/Boilerplate/scripts/build.anarchy.sh GenerateApiReference

      - name: Add API reference to the site
        run: |
          sudo mkdir -p _site/api
          sudo cp -R artifacts/docs-api/. _site/api/

      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
