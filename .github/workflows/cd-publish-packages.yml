name: "[Continuous Delivery] Publish Upgraded Packages"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_base:
        description: 'Baseline commit SHA for generating a release; leave empty to retry publishing'
        required: false
        type: string
      release_head:
        description: 'Reviewed main commit SHA for generating a release'
        required: false
        type: string
      release_bump:
        description: 'Bump for the baseline range; choose none to retry publishing'
        type: choice
        options: [none, patch, minor, major]
        default: none
      confirm_release:
        description: 'I reviewed the baseline, bump and release policy requirements'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  release_gate:
    name: "Prevent release App push recursion"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Check release App identity
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          BOT_LOGIN: ${{ vars.RELEASE_APP_BOT_LOGIN }}
        run: |
          set -euo pipefail
          if [[ ! "$BOT_LOGIN" =~ ^[a-zA-Z0-9-]+\[bot\]$ ]]; then
            echo 'Set RELEASE_APP_BOT_LOGIN to the dedicated App bot login.' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "${ACTOR,,}" == "${BOT_LOGIN,,}" ]]; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

  packages_publish:
    name: "Validate and publish all new versions"
    needs: release_gate
    if: needs.release_gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      id-token: write
    timeout-minutes: 60
    steps:
      - name: Require main for manual dispatch
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo 'Manual publishing must run the workflow from main.' >&2
          exit 1

      - name: Create release App installation token
        id: release_app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify configured App identity
        if: vars.RELEASE_APP_BOT_LOGIN != format('{0}[bot]', steps.release_app.outputs.app-slug)
        run: |
          echo 'RELEASE_APP_BOT_LOGIN does not match the configured App.' >&2
          exit 1

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release_app.outputs.token }}
          persist-credentials: false

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate release request
        id: release_request
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_BASE_INPUT: ${{ inputs.release_base }}
          RELEASE_HEAD_INPUT: ${{ inputs.release_head }}
          RELEASE_BUMP_INPUT: ${{ inputs.release_bump }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            exit 0
          fi
          if [[ -z "$RELEASE_BASE_INPUT" && -z "$RELEASE_HEAD_INPUT" && "$RELEASE_BUMP_INPUT" == none && "$CONFIRM_RELEASE" == false ]]; then
            exit 0
          fi
          if [[ ! "$RELEASE_BASE_INPUT" =~ ^[0-9a-f]{40}$ || ! "$RELEASE_HEAD_INPUT" =~ ^[0-9a-f]{40}$ || ! "$RELEASE_BUMP_INPUT" =~ ^(patch|minor|major)$ || "$CONFIRM_RELEASE" != true ]]; then
            echo 'Provide baseline and head commit SHAs, a patch/minor/major bump, and release confirmation together; or leave all unset for a retry.' >&2
            exit 1
          fi
          base=$(git rev-parse --verify --end-of-options "${RELEASE_BASE_INPUT}^{commit}")
          [[ "$RELEASE_HEAD_INPUT" == "$(git rev-parse HEAD)" ]] || { echo 'main has moved since the reviewed release head.' >&2; exit 1; }
          git merge-base --is-ancestor "$base" HEAD || { echo 'Release baseline is not an ancestor of main.' >&2; exit 1; }
          while IFS= read -r -d '' project; do
            if ! git cat-file -e "${base}:${project}" 2>/dev/null; then
              echo "Baseline predates $project; prepare this release through a reviewed pull request instead." >&2
              exit 1
            fi
          done < <(git ls-files -z -- ':(glob)src/**/*.csproj')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "bump=$RELEASE_BUMP_INPUT" >> "$GITHUB_OUTPUT"

      - name: Generate and validate release changes
        if: steps.release_request.outputs.base != ''
        env:
          ANARCHY_RELOAD_ENV: 'false'
          RELEASE_BASE: ${{ steps.release_request.outputs.base }}
          RELEASE_BUMP: ${{ steps.release_request.outputs.bump }}
        run: |
          set -euo pipefail
          make release_bump_changed RELEASE_BASE="$RELEASE_BASE" RELEASE_HEAD=HEAD RELEASE_BUMP="$RELEASE_BUMP"
          make release_notes RELEASE_BASE="$RELEASE_BASE" RELEASE_HEAD=HEAD
          make validate_release RELEASE_BASE="$RELEASE_BASE" RELEASE_HEAD=HEAD
          make pack

      - name: Commit and push release changes
        if: steps.release_request.outputs.base != ''
        env:
          GH_TOKEN: ${{ steps.release_app.outputs.token }}
          APP_SLUG: ${{ steps.release_app.outputs.app-slug }}
        run: |
          set -euo pipefail
          git add -A -- ':(glob)src/**/*.csproj' ':(glob)src/**/RELEASE-NOTES.md'
          if git diff --cached --quiet; then
            echo 'No release changes to commit.'
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -m 'chore(release): Bump affected packages'
          gh auth setup-git
          git push origin HEAD:refs/heads/main

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Pack and publish in dependency order
        env:
          ANARCHY_RELOAD_ENV: 'false'
        run: |
          make publish \
            SOURCE=https://api.nuget.org/v3/index.json \
            API_KEY="${{steps.login.outputs.NUGET_API_KEY}}"
