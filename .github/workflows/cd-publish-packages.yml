name: "[Continuous Delivery] Publish Upgraded Packages"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_base:
        description: 'Optional baseline commit to generate bumps before publishing (leave empty to retry publishing)'
        required: false
        type: string
      release_bump:
        description: 'Bump when a baseline is provided'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  packages_publish:
    name: "Validate and publish all new versions"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack and publish in dependency order
        env:
          ANARCHY_RELOAD_ENV: 'false'
        run: |
          make publish \
            SOURCE=https://api.nuget.org/v3/index.json \
            API_KEY="${{steps.login.outputs.NUGET_API_KEY}}"