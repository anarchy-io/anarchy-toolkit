name: Code Quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  code-quality:
    name: "[Pull Request] Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release versions
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: ./src/Automation/Boilerplate/scripts/build.fallout.sh ValidateLocalRelease --release-base "$RELEASE_BASE"

      - name: Validate agent skills
        run: ./src/Automation/Boilerplate/scripts/build.fallout.sh ValidateAgentSkills

      - name: Check the conventions skill matches the docs
        run: docs/scripts/sync-skill-docs.sh --check

      - name: Run code quality checks
        run: ./src/Automation/Boilerplate/scripts/build.fallout.sh PullRequest
