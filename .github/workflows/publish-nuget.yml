name: Publish NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    name: Test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run unit tests
        run: dotnet test --project tests/Unit/Unit.csproj --configuration Release
      - name: Pack and publish in dependency order
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUKE_RELOAD_ENV: 'false'
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo 'The NUGET_API_KEY secret is required.' >&2
            exit 1
          fi
          ./scripts/build.nuke.sh Publish \
            --nu-get-source https://api.nuget.org/v3/index.json \
            --nu-get-api-key "$NUGET_API_KEY"
