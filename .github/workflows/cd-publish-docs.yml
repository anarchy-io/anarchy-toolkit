name: "[Continuous Delivery] Publish Updated Documentation"

on:
  push:
    branches: [main]
    paths:
      - 'docs/portal/**'
      - 'docs/api-reference/**'
      - '.anarchy-toolkit.json'
      - 'Directory.*.props'
      - 'Directory.*.targets'
      - 'Anarchy.Toolkit.sln'
      - 'global.json'
      - 'nuget.config'
      - 'build/**'
      - 'scripts/make/targets/monorepo.mk'
      - 'src/**/*.cs'
      - 'src/**/*.csproj'
      - 'src/Automation.Build/**'
      - 'src/Automation/Boilerplate/**'
      - 'src/*/README.md'
      - 'samples/README.md'
      - '.github/workflows/cd-publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  docs_build:
    name: "Build site"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync package and sample READMEs
        run: docs/portal/scripts/sync-readmes.sh

      - uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/portal
          destination: ./_site

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build API reference with DocFX
        run: make docs_api_build

      # The portal's /api/ navigation points to the DocFX output; publish both from one Pages artifact.
      - name: Add API reference to the portal
        run: |
          sudo mkdir -p _site/api
          sudo cp -R artifacts/docs-api/. _site/api/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  docs_deploy:
    name: "Deploy to GitHub Pages"
    needs: docs_build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
