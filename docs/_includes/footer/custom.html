<!-- Renders ```mermaid blocks (left as code by kramdown) as diagrams, as GitHub does -->
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  if (blocks.length > 0) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    blocks.forEach((block) => {
      const diagram = document.createElement("div");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      (block.closest("div.language-mermaid") || block.parentElement).replaceWith(diagram);
    });
    // Brand tokens from assets/css/tokens.css
    const style = getComputedStyle(document.documentElement);
    const token = (name) => style.getPropertyValue(`--anarchy-${name}`).trim();
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        fontFamily: token("font-sans"),
        primaryColor: token("cloud"),
        primaryTextColor: token("black"),
        primaryBorderColor: token("red"),
        lineColor: token("steel"),
        secondaryColor: token("white"),
        tertiaryColor: token("cloud"),
        clusterBkg: token("white"),
        clusterBorder: token("border")
      }
    });
    await mermaid.run({ querySelector: ".mermaid" });
  }
</script>
